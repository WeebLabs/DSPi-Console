name: CI

# Several guarantees in the room-correction spec are cross-platform
# determinism claims, and the DSPMath parity requirement exists specifically to
# stop two implementations of the same filter maths drifting apart. Neither
# survives without automated enforcement, so this is a prerequisite of the
# portable core rather than later cleanup (spec section 9.1).

on:
  push:
    branches: [main, room-correction]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # No Intel macOS runner: GitHub is retiring them and jobs targeting
        # macos-13 now sit queued indefinitely, which blocks the determinism
        # comparison rather than failing it. x86_64 coverage comes from the
        # Linux and Windows runners, which are both x86_64 and use different
        # compilers again, so nothing is actually lost.
        include:
          - name: macos-arm64
            os: macos-14
          - name: windows-x64
            os: windows-2022
          - name: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S "Core/RoomCorrection" -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      # The corpus run is the determinism check: identical inputs must produce
      # identical numbers on every platform. The artifacts are compared in the
      # `determinism` job below rather than here, because a single job cannot
      # see the others' output.
      - name: Acceptance corpus
        shell: bash
        run: |
          # No -v: the per-band lines carry filter frequencies, and two
          # different filter sets can produce the same response, so comparing
          # them would fail on a difference that does not matter. The metrics
          # summarize the response, which is what the promise is about.
          if [ -f build/dspi_rc_cli ]; then
            ./build/dspi_rc_cli corpus | tee corpus-${{ matrix.name }}.txt
          else
            ./build/Release/dspi_rc_cli.exe corpus | tee corpus-${{ matrix.name }}.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.name }}
          path: corpus-${{ matrix.name }}.txt

  determinism:
    name: cross-platform determinism
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: corpus-*
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          sparse-checkout: Core/RoomCorrection/tools/compare_corpus.py
          sparse-checkout-cone-mode: false
          path: repo

      # Compared numerically, not textually.
      #
      # The first run of this job compared byte for byte and failed: the three
      # platforms produced results differing in the third decimal place. That
      # is not a bug, it is C's transcendental functions not being required to
      # be correctly rounded - log, exp, sin, tan and pow differ in the last
      # ulp between glibc, Apple's libm and the MSVC runtime, and a search
      # amplifies that into a visible difference.
      #
      # Structure is still compared exactly, so a real divergence - a different
      # band count, a failed gate, a missing scenario - fails loudly. Only the
      # numbers get tolerance, and the tolerance is far below anything audible.
      - name: Compare corpus output across platforms
        run: |
          ls -1 corpus-*.txt
          python3 repo/Core/RoomCorrection/tools/compare_corpus.py corpus-*.txt

  app:
    name: macOS app and Swift tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The project is saved in Xcode project format 77, which only Xcode 26
      # and later can open; a runner with Xcode 15 or 16 fails with "future
      # Xcode project file format" before it compiles anything.
      #
      # Rather than leave a permanently red check, or a green one that tested
      # nothing, this looks for a new enough Xcode and says plainly when it
      # cannot find one. The day the runner images ship Xcode 26, this job
      # starts testing for real with no change here.
      - name: Find Xcode 26 or newer
        id: xcode
        run: |
          best=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            version=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null \
                      | head -1 | awk '{print $2}')
            major=${version%%.*}
            if [ -n "$major" ] && [ "$major" -ge 26 ] 2>/dev/null; then
              best="$app"
            fi
          done
          echo "path=$best" >> "$GITHUB_OUTPUT"
          if [ -z "$best" ]; then
            echo "::notice::No Xcode 26+ on this runner; the app build cannot open a format 77 project. Skipping."
            xcodebuild -version
          else
            echo "Using $best"
          fi

      # No `continue-on-error` and no `xcpretty`.
      #
      # The first version of this job had both, and reported success in eight
      # seconds - long enough to check out the repository and nothing else.
      # xcpretty is not installed on the runners, so the pipeline failed
      # immediately and `continue-on-error` painted it green. A check that
      # always passes is worse than no check, because it is trusted.
      #
      # If the runner's Xcode cannot build this project, that should be a red
      # build with a readable reason, not a silent pass.
      - name: Build and test
        if: steps.xcode.outputs.path != ''
        run: |
          set -o pipefail
          sudo xcode-select -s "${{ steps.xcode.outputs.path }}"
          xcodebuild test \
            -project "DSPi Console.xcodeproj" \
            -scheme "DSPi Console" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
